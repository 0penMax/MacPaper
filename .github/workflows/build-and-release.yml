name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build application
        run: |
          chmod +x ./build_app.sh
          # Modify the script to work non-interactively in CI
          sed -i '' 's/read -n 1 -r/echo "n"/g' ./build_app.sh
          ./build_app.sh
        env:
          CI: true

      - name: Zip application
        run: |
          cd build
          zip -r MacPaper.zip MacPaper.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacPaper
          path: build/MacPaper.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MacPaper
          path: release-artifacts

      - name: Generate release notes
        run: |
          if previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null); then
            commit_range="${previous_tag}..${GITHUB_SHA}"
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${VERSION}"
          else
            commit_range="$GITHUB_SHA"
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/commits/${VERSION}"
          fi

          {
            echo '## What changed'
            echo
            git log --reverse --no-merges --pretty='- %s (`%h`)' "$commit_range"
            echo
            echo "**Full Changelog**: ${changelog_url}"
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" release-artifacts/MacPaper.zip \
            --target "$GITHUB_SHA" \
            --title "MacPaper ${VERSION}" \
            --notes-file release-notes.md
